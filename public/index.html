<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>解方島・我的島屋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* 版面：粉彩 low-poly 3D 澎湖小島佔滿畫面；登島卡片置中；登入後右側（手機為底部）展開個人面板；老師後台為全螢幕覆蓋層 */
:root{
  --sky:#cdeef3; --panel:#ffffff; --ink:#1d4550; --muted:#5d7a80; --line:#dcebe8;
  --accent:#ff7f5c; --accent-ink:#ffffff; --deep:#1f5866; --sun:#ffc552; --sun-soft:#fff3d6;
  --leaf:#4a9a5e; --leaf-soft:#e3f3e6; --warn:#c2492f; --warn-soft:#fde7df; --soft:#eef7f6;
  --display:"Huninn","Noto Sans TC","PingFang TC",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65}
button,input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--deep);outline-offset:2px}
#scene{position:fixed;inset:0;touch-action:none}
#scene canvas{display:block}
.labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:var(--deep);color:#fff;font-weight:700;border-radius:999px;padding:4px 14px;white-space:nowrap;box-shadow:0 4px 14px rgba(20,60,70,.3);font-size:14px}
.tag small{opacity:.8;font-weight:500;margin-left:6px}
.brand{position:fixed;left:18px;top:14px;display:flex;flex-direction:column;line-height:1.2;pointer-events:none}
.brand h1{font-family:var(--display);font-size:34px;margin:0;color:var(--deep);letter-spacing:.06em;text-shadow:0 2px 0 #fff}
.brand span{font-size:13px;color:var(--deep);opacity:.8;font-weight:700}
.hud{position:fixed;left:16px;bottom:16px;display:flex;gap:8px}
.icon{width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.95);box-shadow:0 2px 10px rgba(20,60,70,.18);font-size:18px;font-weight:900;cursor:pointer;color:var(--deep)}
.teacher-btn{position:fixed;right:16px;bottom:16px;border:none;background:rgba(255,255,255,.95);border-radius:999px;padding:8px 16px;font-weight:700;box-shadow:0 2px 10px rgba(20,60,70,.18);cursor:pointer;color:var(--deep)}
.teacher-btn:hover{background:#fff}
/* login */
.gate{position:fixed;left:50%;bottom:7%;transform:translateX(-50%);width:min(400px,calc(100% - 32px));background:rgba(255,255,255,.96);border-radius:26px;padding:26px 26px 22px;box-shadow:0 18px 50px rgba(20,60,70,.25);text-align:center}
.gate h2{font-family:var(--display);font-size:28px;margin:0 0 4px;color:var(--deep);text-wrap:balance}
.gate p{margin:0 0 16px;color:var(--muted)}
.gate form{display:flex;gap:8px}
.gate input{flex:1;min-width:0;border:2px solid var(--line);border-radius:999px;padding:10px 18px;font-size:17px;background:#fff;text-align:center}
.gate input:focus{border-color:var(--accent);outline:none}
.go{border:none;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:900;padding:10px 22px;font-size:17px;cursor:pointer;box-shadow:0 4px 0 #d9603f}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 #d9603f}
.go:disabled{opacity:.5;cursor:default}
.gate .msg{min-height:22px;margin-top:10px;font-size:14px;color:var(--warn)}
.gate .hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.waves{display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
/* panel */
.panel{position:fixed;top:12px;right:12px;bottom:12px;width:min(440px,calc(100% - 24px));background:var(--panel);border-radius:24px;box-shadow:0 12px 40px rgba(20,60,70,.25);display:flex;flex-direction:column;overflow:hidden;z-index:5}
.ph{padding:18px 20px 0;background:linear-gradient(180deg,var(--sun-soft),#fff)}
.ph-top{display:flex;align-items:flex-start;gap:10px}
.ph .who{flex:1;min-width:0}
.ph .eb{font-size:12.5px;font-weight:700;color:var(--accent);letter-spacing:.06em}
.ph h2{font-family:var(--display);font-size:30px;line-height:1.2;margin:2px 0 0;color:var(--deep);text-wrap:balance}
.ph .nm{color:var(--muted);font-weight:700}
.leave{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;font-weight:700;color:var(--muted);flex:none}
.stars{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:13px;color:var(--muted)}
.stars b{font-size:20px;letter-spacing:2px;color:var(--sun)}
.stars b i{font-style:normal;color:#e3e3dc}
.tabs{display:flex;gap:4px;margin-top:12px}
.tabs button{flex:1;border:none;background:transparent;padding:9px 4px;border-radius:12px 12px 0 0;cursor:pointer;font-weight:700;color:var(--muted);font-size:14.5px}
.tabs button.on{background:#fff;color:var(--deep);box-shadow:0 -2px 0 var(--accent) inset}
.pb{flex:1;overflow-y:auto;padding:16px 20px 24px;display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--line)}
.notice{background:var(--deep);color:#fff;border-radius:14px;padding:10px 14px;font-size:14px}
.notice b{display:block;font-size:12px;opacity:.8;letter-spacing:.06em}
.h3{font-weight:900;font-size:15px;margin:0 0 8px;color:var(--deep);display:flex;align-items:center;gap:8px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--soft);font-size:14.5px}
.steps li .ck{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;border:2px dashed #c9dbd8;font-size:14px;color:#9bb}
.steps li.done{background:var(--leaf-soft)}
.steps li.done .ck{background:var(--leaf);border:none;color:#fff}
.steps li small{display:block;color:var(--muted);font-size:12.5px}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.todo li{padding:9px 12px 9px 36px;border-radius:12px;background:var(--sun-soft);position:relative;font-size:14.5px}
.todo li::before{content:"";position:absolute;left:13px;top:15px;width:12px;height:12px;border-radius:3px;border:2px solid #d9a63a}
.todo li.fix{background:var(--warn-soft)}
.todo li.fix::before{border-color:var(--warn)}
.advice{background:var(--sun-soft);border-left:4px solid var(--sun);border-radius:0 14px 14px 0;padding:12px 14px}
.advice b{display:block;color:#a8741a;font-size:12.5px;letter-spacing:.06em;margin-bottom:2px}
.advice p{margin:0}
.quad{display:grid;grid-template-columns:1fr;gap:10px}
.cell{border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.cell .ct{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.cell .ct b{font-family:var(--display);font-size:18px;color:var(--deep)}
.cell .ct small{color:var(--muted)}
.cell .ct span{margin-left:auto;font-size:12px;color:var(--muted)}
.cell ol{margin:0;padding-left:1.3em}
.cell li{margin:3px 0}
.cell li::marker{color:var(--accent);font-weight:700}
.cell .empty{color:var(--muted);font-size:13.5px;background:var(--soft);border-radius:10px;padding:8px 10px}
.ideas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ideas li{display:flex;gap:10px;background:var(--soft);border-radius:14px;padding:12px 14px;font-size:15.5px}
.ideas li span{font-family:var(--display);color:var(--accent);font-size:20px;line-height:1.3}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.tw .tt{padding:10px 12px 0;font-weight:900;color:var(--deep)}
table{border-collapse:collapse;width:100%;min-width:380px;font-variant-numeric:tabular-nums;font-size:13.5px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px;background:var(--soft)}
td.n,th.n{text-align:right;white-space:nowrap}
tr.bad td{background:var(--warn-soft)}
.fixnote{display:block;color:var(--warn);font-size:12px}
tfoot td{font-weight:900;border-bottom:none}
.tot{font-family:var(--display);font-size:20px;color:var(--deep)}
.chk{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{font-size:12.5px;padding:4px 10px;border-radius:10px}
.badge.ok{background:var(--leaf-soft);color:var(--leaf)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.none{border:2px dashed var(--line);border-radius:14px;padding:16px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--deep);color:#fff;border-radius:999px;padding:8px 18px;z-index:50;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90%;text-align:center}
/* teacher */
.admin{position:fixed;inset:0;background:rgba(20,50,58,.45);z-index:20;display:flex;padding:16px}
.adm{flex:1;background:#f6faf9;border-radius:22px;display:grid;grid-template-columns:260px 1fr;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.adm-side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.adm-side .top{padding:16px 14px 10px;border-bottom:1px solid var(--line)}
.adm-side h2{margin:0 0 8px;font-family:var(--display);font-size:22px;color:var(--deep)}
.adm-side input{width:100%;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#f6faf9}
.slist{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:2px}
.slist button{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;text-align:left;border:none;background:transparent;padding:7px 10px;border-radius:10px;cursor:pointer}
.slist button:hover{background:var(--soft)}
.slist button.on{background:var(--deep);color:#fff}
.slist button small{display:block;font-size:12px;opacity:.7}
.slist .st{font-size:12px;letter-spacing:1px;color:var(--sun)}
.slist button.on .st{color:#ffe3a1}
.slist .sec{font-size:12px;color:var(--muted);padding:10px 10px 2px;font-weight:700}
.adm-side .bot{padding:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.adm-main{display:flex;flex-direction:column;min-height:0}
.adm-bar{display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);background:#fff;flex-wrap:wrap}
.adm-bar h3{margin:0;font-size:18px;margin-right:auto;font-family:var(--display);color:var(--deep)}
.dirty{font-size:12.5px;color:var(--warn);font-weight:700}
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--deep)}
.btn.pri{background:var(--deep);color:#fff;border-color:var(--deep)}
.btn.danger{color:var(--warn)}
.btn.armed{background:var(--warn);color:#fff;border-color:var(--warn)}
.btn:disabled{opacity:.45;cursor:default}
.adm-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:16px}
.fset{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.fset>h4{margin:0;font-size:15px;color:var(--deep)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
label.f small{font-weight:400}
label.f input,label.f textarea{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fbfdfd;font-weight:400;color:var(--ink);font-size:14.5px;resize:vertical}
label.f textarea{min-height:120px;line-height:1.6}
.bt{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:#fbfdfd}
.bt-head{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.bt-head label{flex:1;min-width:160px}
.bt table{min-width:640px}
.bt td{padding:3px 4px;border-bottom:none}
.bt td input{width:100%;border:1px solid var(--line);border-radius:8px;padding:5px 7px;background:#fff;font-size:13.5px}
.bt td.calc{font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}
.bt td.calc.bad{color:var(--warn);font-weight:700}
.x{border:none;background:none;color:var(--muted);cursor:pointer;font-size:16px}
.x:hover{color:var(--warn)}
.pwgate{position:relative;left:auto;bottom:auto;transform:none;margin:auto}
.pwrow{display:flex;gap:8px}
.pwrow input{flex:1;min-width:0;border:2px solid var(--line);border-radius:999px;padding:10px 18px;font-size:16px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.6}}
@media (max-width:760px){
  .brand h1{font-size:26px}
  .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:64%;border-radius:22px}
  .gate{bottom:5%}
  .adm{grid-template-columns:1fr;grid-template-rows:200px 1fr}
  .adm-side{border-right:none;border-bottom:1px solid var(--line)}
  .admin{padding:6px}
  .hud{bottom:auto;top:70px;left:auto;right:12px;flex-direction:column}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="scene" aria-hidden="true"></div>
<div class="labels" id="labels"></div>
<div class="brand"><h1 id="siteTitle">解方島</h1><span id="siteSub">地方創生規劃與應用</span></div>

<div class="gate" id="gate">
  <h2 id="welcome">歡迎登島！</h2>
  <p id="welcomeSub">輸入你的名字，找到你的島屋。</p>
  <form id="loginForm" autocomplete="off">
    <label for="nameIn" hidden>你的名字</label>
    <input id="nameIn" placeholder="你的名字" maxlength="20">
    <button class="go" id="goBtn">登島</button>
  </form>
  <div class="msg" id="loginMsg" role="status"></div>
  <div class="hint" id="loginHint">只會看到你自己的盤點、解方和預算</div>
</div>

<aside class="panel" id="panel" hidden>
  <div class="ph">
    <div class="ph-top">
      <div class="who"><div class="eb">我的地方</div><h2 id="pPlace"></h2><div class="nm" id="pName"></div></div>
      <button class="leave" id="leaveBtn">離開島屋</button>
    </div>
    <div class="stars"><span>島屋完成度</span><b id="pStars"></b><span id="pStarsTxt"></span></div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="home" class="on">我的島屋</button>
      <button role="tab" data-tab="quad">盤點的問題</button>
      <button role="tab" data-tab="sol">解方與預算</button>
    </div>
  </div>
  <div class="pb" id="pBody"></div>
</aside>

<div class="hud"><button class="icon" id="zin" aria-label="拉近">＋</button><button class="icon" id="zout" aria-label="拉遠">－</button></div>
<button class="teacher-btn" id="teacherBtn">老師</button>
<div class="admin" id="pwBox" hidden><form class="gate pwgate" id="pwForm"><h2>老師登入</h2><p>輸入在 Netlify 設定的老師密碼</p><div class="pwrow"><label for="pwIn" hidden>老師密碼</label><input id="pwIn" type="password" placeholder="老師密碼" autocomplete="current-password"><button class="go">進入</button></div><div class="msg" id="pwMsg" role="status"></div><button type="button" class="btn" id="pwCancel">取消</button></form></div>

<div class="admin" id="admin" hidden>
  <div class="adm">
    <div class="adm-side">
      <div class="top"><h2>老師後台</h2><label for="admQ" hidden>搜尋</label><input id="admQ" placeholder="搜尋名字或地點"></div>
      <div class="slist" id="slist"></div>
      <div class="bot"><button class="btn" id="seedBtn">放上課堂的同學資料</button><button class="btn" id="addStu">＋ 新增同學</button><button class="btn" id="closeAdm">回到島上</button></div>
    </div>
    <div class="adm-main">
      <div class="adm-bar"><h3 id="edTitle">選一位同學開始編輯</h3><span class="dirty" id="dirty" hidden>尚未儲存</span>
        <button class="btn" id="preview" hidden>用他的身分預覽</button>
        <button class="btn" id="discard" hidden>放棄修改</button>
        <button class="btn danger" id="delStu" hidden>刪除</button>
        <button class="btn pri" id="save" disabled>儲存</button></div>
      <div class="adm-body" id="edBody"><div class="none">從左邊選一位同學，或按「網站文字」修改登島畫面與公告。</div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="confetti" id="confetti"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=v=>v==null?"—":Number(v).toLocaleString("en-US");
const num=s=>{const m=String(s??"").replace(/,/g,"").match(/\d+(\.\d+)?/);return m?Number(m[0]):null};
const norm=s=>String(s||"").replace(/\s/g,"").replace(/臺/g,"台");
const clone=o=>JSON.parse(JSON.stringify(o));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mergeCfg=c=>{const o={...CFG_DEFAULT};for(const k in (c||{}))if(k in o&&(c[k]||k==="notice"))o[k]=c[k];return o};
let toastT;function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,2600)}

const CFG_DEFAULT={title:"解方島",sub:"地方創生規劃與應用",welcome:"歡迎登島！",welcomeSub:"輸入你的名字，找到你的島屋。",hint:"只會看到你自己的盤點、解方和預算",notFound:"島上找不到這個名字。檢查一下有沒有打錯字，或問問老師。",notice:""};
const QUAD=[["num","數字","發生了什麼？"],["itv","訪談","為什麼？"],["obs","觀察","現場長什麼樣？"],["beh","行為","他們實際怎麼選擇？"]];
const STEP_INFO=[["選定我的地方","地基"],["盤點填滿兩格以上","牆壁"],["四象限四格都有內容","屋頂"],["提出解方","插上旗子"],["預算核算全部正確","點亮燈火"]];

let STUDENTS={};   // 同學模式：只有自己的資料
let ALL={};        // 老師後台：全部同學
let CFG={...CFG_DEFAULT};
let current=null;  // logged-in student id
let PW="",previewing=false;

/* ---------- analysis ---------- */
function analyze(rec){
  const q=rec.quad||{};
  const cells=QUAD.filter(([k])=>(q[k]||[]).length).length;
  const tables=(rec.tables||[]).map(t=>{
    const rows=(t.rows||[]).map(r=>{
      const vals=[r.unit,r.qty,r.times].map(num).filter(v=>v!=null);
      const calc=vals.length?vals.reduce((a,b)=>a*b,1):null;
      const subN=num(r.sub);
      return {...r,calc,subN,bad:calc!=null&&subN!=null&&calc!==subN,missing:subN==null};
    });
    const sum=rows.reduce((a,r)=>a+(r.subN||0),0);
    const stated=num(t.total);
    return {title:t.title||"",rows,sum,stated,shown:stated??sum,badRows:rows.filter(r=>r.bad||r.missing),totalOff:stated!=null&&stated!==sum,noTotal:stated==null};
  });
  const hasP=(rec.ideas||[]).length>0;
  const budgetOk=hasP&&tables.length>0&&tables.every(t=>!t.badRows.length&&!t.totalOff&&!t.noTotal);
  const steps=[!!(rec.place||"").trim(),cells>=2,cells===4,hasP,budgetOk];
  const total=tables.reduce((a,t)=>a+t.shown,0);
  const todo=[];
  if(!steps[0])todo.push(["先選定你要盤點的地方",""]);
  QUAD.forEach(([k,t,s])=>{if(!(q[k]||[]).length)todo.push([`補上「${t}」格：${s}`,""])});
  if(!hasP)todo.push(["根據盤點，提出一個解方",""]);
  else if(!tables.length)todo.push(["幫解方列出預算表",""]);
  tables.forEach(t=>{
    const pre=tables.length>1&&t.title?`（${t.title}）`:"";
    t.rows.forEach(r=>{
      if(r.missing)todo.push([`${pre}「${r.item}」的小計還沒填`,"fix"]);
      else if(r.bad)todo.push([`${pre}重算「${r.item}」：單價 × 數量 × 次數 = ${fmt(r.calc)}，表上寫 ${fmt(r.subN)}`,"fix"]);
    });
    if(t.noTotal)todo.push([`${pre}填上預算合計（各項加起來是 ${fmt(t.sum)} 元）`,"fix"]);
    else if(t.totalOff)todo.push([`${pre}合計寫 ${fmt(t.stated)} 元，但各項小計加起來是 ${fmt(t.sum)} 元`,"fix"]);
  });
  return {cells,tables,hasP,budgetOk,steps,done:steps.filter(Boolean).length,total,todo};
}

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function mat(c,opt){const k=c+JSON.stringify(opt||{});return MATS[k]||(MATS[k]=new T.MeshStandardMaterial(Object.assign({color:c,flatShading:true,roughness:.95,metalness:0},opt||{})))}
function jitter(g,amt,keepY){
  const p=g.attributes.position,map={};
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),y=p.getY(i),z=p.getZ(i),key=[x,y,z].map(v=>v.toFixed(3)).join();
    if(!map[key])map[key]=[(R()-.5)*amt,keepY?0:(R()-.5)*amt,(R()-.5)*amt];
    const d=map[key];p.setXYZ(i,x+d[0],y+d[1],z+d[2]);

}

/* fireworks */
const fws=[];
function firework(pos,color){
  const n=70,g=new T.BufferGeometry(),p=new Float32Array(n*3),v=[];
  for(let i=0;i<n;i++){p[i*3]=pos.x;p[i*3+1]=pos.y;p[i*3+2]=pos.z;const th=R()*6.28,ph=Math.acos(2*R()-1),s=3+R()*2;v.push([Math.sin(ph)*Math.cos(th)*s,Math.cos(ph)*s,Math.sin(ph)*Math.sin(th)*s])}
  g.setAttribute("position",new T.BufferAttribute(p,3));
  const m=new T.PointsMaterial({color,size:.32,transparent:true,opacity:1,depthWrite:false});
  const pts=new T.Points(g,m);scene.add(pts);fws.push({pts,v,life:0});
}
function stepFireworks(dt){
  for(let k=fws.length-1;k>=0;k--){const f=fws[k];f.life+=dt;const p=f.pts.geometry.attributes.position;
    for(let i=0;i<f.v.length;i++){f.v[i][1]-=4*dt;p.array[i*3]+=f.v[i][0]*dt;p.array[i*3+1]+=f.v[i][1]*dt;p.array[i*3+2]+=f.v[i][2]*dt}
    p.needsUpdate=true;f.pts.material.opacity=Math.max(0,1-f.life/1.6);
    if(f.life>1.6){scene.remove(f.pts);f.pts.geometry.dispose();f.pts.material.dispose();fws.splice(k,1)}}
}

function landingView(){camG.theta=camS.theta;camG.phi=1.0;camG.dist=innerWidth<760?74:58;camG.tx=0;camG.ty=0;camG.tz=0;idleSpin=true}

function bindControls(){
  const el=renderer.domElement,pts=new Map();let pinch=0;
  el.addEventListener("pointerdown",e=>{pts.set(e.pointerId,[e.clientX,e.clientY]);el.setPointerCapture(e.pointerId)});
  el.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId))return;const [x0,y0]=pts.get(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===1){camG.theta-=(e.clientX-x0)*.006;camG.phi=Math.min(1.35,Math.max(.45,camG.phi-(e.clientY-y0)*.004));idleSpin=false}
    else if(pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)zoom((pinch-d)*.08);pinch=d}
  });

const tagEl=document.createElement("div");tagEl.className="tag";tagEl.hidden=true;$("labels").appendChild(tagEl);
function tick(){
  const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;

  camera.lookAt(camS.tx,camS.ty,camS.tz);
  const p=water.geometry.attributes.position;
  for(let i=0;i<p.count;i++){const x=waterBase[i*3],z=waterBase[i*3+2];p.array[i*3+1]=Math.sin(x*.16+t*1.1)*.22+Math.cos(z*.2+t*1.4)*.18}
  p.needsUpdate=true;water.geometry.computeVertexNormals();
  anim.forEach(f=>f(t));
  if(myHouse&&myHouse.userData.tick)myHouse.userData.tick(t);
  if(myHouse&&current&&analyze(STUDENTS[current]||{}).budgetOk){fwTimer-=dt;if(fwTimer<=0){fwTimer=3.2;const q=myPlot.pos.clone();q.y+=7;q.x+=(R()-.5)*4;firework(q,["#ffc552","#ff7f5c","#5cc1c4"][(R()*3)|0])}}
  stepFireworks(dt);
  if(myHouse&&current){const v=myPlot.pos.clone();v.y+=4.2;v.project(camera);
    if(v.z<1){tagEl.hidden=false;tagEl.style.transform=`translate(${(v.x*.5+.5)*innerWidth}px,${(-v.y*.5+.5)*innerHeight}px) translate(-50%,-100%)`}else tagEl.hidden=true}
  else tagEl.hidden=true;
  renderer.render(scene,camera);
}

    if(rec.advice)h+=`<div class="advice"><b>老師的下一步建議</b><p>${esc(rec.advice)}</p></div>`;
  }else if(tab==="quad"){
    h+=`<div class="quad">${QUAD.map(([k,t,s])=>{const arr=(rec.quad||{})[k]||[];return `<div class="cell"><div class="ct"><b>${t}</b><small>${s}</small><span>${arr.length} 筆</span></div>${arr.length?`<ol>${arr.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:`<div class="empty">還沒填。空下來的格子，就是接下來幾週的功課。</div>`}</div>`}).join("")}</div>`;
    if(rec.advice)h+=`<div class="advice"><b>老師的下一步建議</b><p>${esc(rec.advice)}</p></div>`;
  }else{
    h+=`<div><div class="h3">我提出的解方</div>${a.hasP?`<ul class="ideas">${rec.ideas.map((x,i)=>`<li><span>${i+1}</span><div>${esc(x)}</div></li>`).join("")}</ul>`:`<div class="none">還沒提出解方。從盤點裡最有把握的一格出發，想一個能回應它的做法。</div>`}</div>`;
    if(a.tables.length){
      h+=`<div><div class="h3">所需預算${a.tables.length>1?`<span style="font-weight:500;color:var(--muted)">・合計 ${fmt(a.total)} 元</span>`:""}</div>`;
      a.tables.forEach(t=>{
        h+=`<div class="tw">${t.title?`<div class="tt">${esc(t.title)}</div>`:""}<table><thead><tr><th>項目</th><th class="n">單價</th><th class="n">數量</th><th class="n">次數</th><th class="n">小計</th></tr></thead><tbody>${t.rows.map(r=>`<tr class="${r.bad||r.missing?"bad":""}"><td>${esc(r.item)}${r.bad?`<span class="fixnote">算算看：應為 ${fmt(r.calc)}</span>`:r.missing?`<span class="fixnote">小計還沒填</span>`:""}</td><td class="n">${esc(r.unit)||"—"}</td><td class="n">${esc(r.qty)||"—"}</td><td class="n">${esc(r.times)||"—"}</td><td class="n">${fmt(r.subN)}</td></tr>`).join("")}</tbody><tfoot><tr><td>合計${t.noTotal?"（自動加總）":""}</td><td></td><td></td><td></td><td class="n tot">${fmt(t.shown)}</td></tr></tfoot></table></div>`;
        const b=[];
        if(t.noTotal)b.push(`<span class="badge warn">合計欄空白，先幫你加總成 ${fmt(t.sum)} 元</span>`);
        else if(t.totalOff)b.push(`<span class="badge warn">各項加起來是 ${fmt(t.sum)} 元，和合計 ${fmt(t.stated)} 元不同</span>`);
        if(t.badRows.length)b.push(`<span class="badge warn">有 ${t.badRows.length} 項要重算（紅色列）</span>`);
        if(!b.length)b.push(`<span class="badge ok">每一項都算對了</span>`);
        h+=`<div class="chk">${b.join("")}</div>`;
      });
      h+=`</div>`;
    }else if(a.hasP)h+=`<div class="none">提出解方後，再列出每一個項目的單價、數量與次數。</div>`;
  }
  $("pBody").innerHTML=h;
}

async function api(route,body){
  const r=await fetch("/api/"+route,body===undefined?{cache:"no-store"}:{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
  let d={};try{d=await r.json()}catch(e){}
  if(!r.ok){const e=new Error(d.error||"http_"+r.status);e.code=d.error||"http";e.data=d;throw e}
  return d;
}
function login(id,remember=true){
  current=id;tab="home";

}

async function refreshMine(){
  if(!current||previewing)return;
  try{const d=await api("login",{name:STUDENTS[current].name});

}

  });

function rowCalc(r){const v=[r.unit,r.qty,r.times].map(num).filter(x=>x!=null);if(!v.length)return["",false];const c=v.reduce((a,b)=>a*b,1),s=num(r.sub);return[`= ${fmt(c)}`,s!=null&&s!==c]}
function renderBudgetEd(){
  const box=$("bEd");
  if(!ed.tables.length){box.innerHTML='<div class="none">還沒有預算表。</div>';return}
  box.innerHTML=ed.tables.map((t,ti)=>`<div class="bt" data-ti="${ti}">
    <div class="bt-head">${`<label class="f" for="bt${ti}">表名（只有一張可留白）<input id="bt${ti}" data-tf="title" value="${esc(t.title)}"></label>`}
      <label class="f" for="btt${ti}" style="max-width:180px">填寫的合計 <small>留白＝自動加總</small><input id="btt${ti}" data-tf="total" value="${esc(t.total)}"></label>
      <button class="btn danger" data-deltbl="${ti}">刪除這張表</button></div>
    <div style="overflow-x:auto"><table><thead><tr><th>項目</th><th>單價</th><th>數量</th><th>次數</th><th>小計</th><th class="n">核算</th><th></th></tr></thead><tbody>
    ${t.rows.map((r,ri)=>{const [c,bad]=rowCalc(r);return `<tr data-ri="${ri}">${["item","unit","qty","times","sub"].map(f=>`<td><label hidden for="c${ti}_${ri}_${f}">${f}</label><input id="c${ti}_${ri}_${f}" data-rf="${f}" value="${esc(r[f])}"></td>`).join("")}<td class="calc ${bad?"bad":""}">${c}</td><td><button class="x" data-delrow="${ri}" aria-label="刪除這一列">✕</button></td></tr>`}).join("")}
    </tbody></table></div><div><button class="btn" data-addrow="${ti}">＋ 新增一列</button></div></div>`).join("");
  box.querySelectorAll(".bt").forEach(el=>{
    const ti=+el.dataset.ti,t=ed.tables[ti];
    el.querySelectorAll("[data-tf]").forEach(i=>i.oninput=()=>{t[i.dataset.tf]=i.value;setDirty(true)});
    el.querySelectorAll("tr[data-ri]").forEach(tr=>{const r=t.rows[+tr.dataset.ri];
      tr.querySelectorAll("[data-rf]").forEach(i=>i.oninput=()=>{r[i.dataset.rf]=i.value;const [c,bad]=rowCalc(r);const cc=tr.querySelector(".calc");cc.textContent=c;cc.classList.toggle("bad",bad);setDirty(true)})});
    el.querySelectorAll("[data-delrow]").forEach(b=>b.onclick=()=>{t.rows.splice(+b.dataset.delrow,1);renderBudgetEd();setDirty(true)});
    el.querySelector("[data-addrow]").onclick=()=>{t.rows.push({item:"",unit:"",qty:"",times:"",sub:""});renderBudgetEd();setDirty(true)};
    el.querySelector("[data-deltbl]").onclick=()=>{ed.tables.splice(ti,1);renderBudgetEd();setDirty(true)};
  });
}
function cleanRec(r){
  return {order:r.order||0,name:(r.name||"").trim(),place:(r.place||"").trim(),
    quad:Object.fromEntries(QUAD.map(([k])=>[k,(r.quad[k]||[]).filter(Boolean)])),
    advice:(r.advice||"").trim(),note:(r.note||"").trim(),ideas:(r.ideas||[]).filter(Boolean),
    tables:(r.tables||[]).map(t=>({title:(t.title||"").trim(),total:(t.total||"").trim(),rows:t.rows.filter(x=>Object.values(x).some(v=>String(v).trim())).map(x=>({item:(x.item||"").trim(),unit:(x.unit||"").trim(),qty:(x.qty||"").trim(),times:(x.times||"").trim(),sub:(x.sub||"").trim()}))}))};
}

$("preview").onclick=()=>{if(edDirty){toast("先儲存，再預覽");return}const id=edId;$("admin").hidden=true;if(current)removeMyHouse();previewing=true;STUDENTS={[id]:ALL[id]};login(id,false);toast("預覽中：按「離開島屋」結束")};

initScene();landingView();applyCfg();initData();
